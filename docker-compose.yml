x-airflow-common: &airflow-common
  build: ./airflow
  image: 1c-analytics/airflow:2.10.4
  user: "${AIRFLOW_UID}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DAG_DISCOVERY_SAFE_MODE: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    PYTHONPATH: /opt/airflow
    # Postgres (рабочая БД для ETL)
    ONEC_DB_HOST: postgres
    ONEC_DB_PORT: "5432"
    ONEC_DB_NAME: ${ONEC_DB_NAME:-onec}
    ONEC_DB_USER: ${ONEC_DB_USER:-${POSTGRES_USER}}
    ONEC_DB_PASSWORD: ${ONEC_DB_PASSWORD:-${POSTGRES_PASSWORD}}
    # 1C OData
    ONEC_ODATA_URL: ${ONEC_ODATA_URL}
    ONEC_ODATA_USER: ${ONEC_ODATA_USER}
    ONEC_ODATA_PASSWORD: ${ONEC_ODATA_PASSWORD}
    ONEC_TIMEZONE: ${ONEC_TIMEZONE:-Asia/Almaty}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./etl:/opt/airflow/etl
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: 1c-analytics/api:0.1.0
    environment:
      ONEC_DB_HOST: postgres
      ONEC_DB_PORT: "5432"
      ONEC_DB_NAME: ${ONEC_DB_NAME:-onec}
      ONEC_DB_USER: ${ONEC_DB_USER:-${POSTGRES_USER}}
      ONEC_DB_PASSWORD: ${ONEC_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      ONEC_TIMEZONE: ${ONEC_TIMEZONE:-Asia/Almaty}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      API_KEY: ${API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/health\", timeout=3).status==200 else 1)'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  postgres-data:

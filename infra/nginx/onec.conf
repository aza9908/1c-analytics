# Reverse proxy для 1c-analytics.
# - Слушает 80 и проксирует на Next.js (3000)
# - Сжимает JSON-ответы (API дашбордов сейчас 3-10 МБ → ~0.5-1 МБ gz)
# - Прозрачно для FastAPI/Next.js — они уже не сжимают.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain application/octet-stream;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Большие JSON-ответы дашбордов могут идти секунду+, не таймаутиться раньше.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    client_max_body_size 10m;

    # Не буферизовать на диск — стримим в память (с большим буфером, чтобы 10 МБ влезали).
    proxy_buffering on;
    proxy_buffers 64 64k;
    proxy_busy_buffers_size 256k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
